services:
  - type: web
    name: aepfm-api
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "aepfm-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://aepfm-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://aepfm-frontend.onrender.com"
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_ENDPOINT_URL
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: FRONTEND_BASE_URL
        value: "https://aepfm-frontend.onrender.com"
      - key: SMS_BACKEND
        value: "console"
      - key: SMS_ALLOWED_NUMBERS
        sync: false
      - key: TEXTBEE_API_KEY
        sync: false
      - key: TEXTBEE_DEVICE_ID
        sync: false
      - key: CRON_SECRET
        sync: false


  - type: web
    name: aepfm-frontend
    runtime: static
    rootDir: front-end_crm
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: "https://aepfm-api.onrender.com"
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html